<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브랜드 소개 | 입덕볶이</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="blend.css">
</head>
<body>
    <div class="wrap">

        <!-- 헤더 -->
        <header class="header">
            <h1 class="logo">
                <a href="../../index.html">
                    <img src="../../img/logo.png" alt="LOGO">
                </a>
            </h1>
            <button type="button" class="menu-btn" aria-label="메뉴 열기">
                <i data-lucide="menu"></i>
            </button>
        </header>

        <!-- 햄버거 메뉴 -->
        <nav class="side-menu">
            <div class="dim"></div>
            <div class="menu-panel">
                <div class="menu-top">
                    <button type="button" class="menu-close" aria-label="메뉴 닫기">
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <ul class="menu-list">
                    <li><a href="../lists/lists.html">메뉴</a></li>
                    <li><a href="../blend/blend.html">브랜드 소개</a></li>
                    <li><a href="#">매장찾기</a></li>
                    <li><a href="#">고객센터</a></li>
                    <li><a href="#">회원가입/로그인</a></li>
                </ul>
            </div>
        </nav>

        <main class="blend">
            <!-- 브랜드 비주얼 -->
            <section class="brand-visual">
                <img src="img/brand_visual.jpg" alt="입덕볶이 브랜드 이미지">
            </section>

            <!-- 브랜드 소개 -->
            <section class="brand-intro">
                <h2 class="brand-title">
                    친구, 가족과 함께 입덕하는 떡볶이
                    <span><em>입덕볶이!</em> <small>브랜드의 지향성 글</small></span>
                </h2>
                <p class="brand-text">
                    한 흐름 속에서 나타나는 새로운 표현 방식과 예술적 실험을 소개하고,
                    빠르게 변화하는 기술과 예술한 흐름 속에서 나타나는 새로운 표현 방식과
                    예술적 실험을 소개하고, 빠르게 변화하는 기술과 예술
                </p>
                <div class="brand-imgs">
                    <div class="img-01"><img src="img/brand_01.jpg" alt=""></div>
                    <div class="img-02"><img src="img/brand_02.jpg" alt=""></div>
                </div>
            </section>
        </main>

    </div>

    <!-- lucide 아이콘 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // 아이콘 그리기
        lucide.createIcons();

        // ===== 햄버거 메뉴 =====
        const sideMenu = document.querySelector('.side-menu');

        function openMenu() {
            sideMenu.classList.add('open');
            document.body.classList.add('no-scroll');
        }
        function closeMenu() {
            sideMenu.classList.remove('open');
            document.body.classList.remove('no-scroll');
        }

        document.querySelector('.menu-btn').addEventListener('click', openMenu);
        document.querySelector('.menu-close').addEventListener('click', closeMenu);
        sideMenu.querySelector('.dim').addEventListener('click', closeMenu);
    </script>
</body>
</html>
